const ANIM={};
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_q1=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_q3=new THREE.Quaternion(),_down=new THREE.Vector3(0,-1,0);
const skinMats=new Map();
function skinMat(base,hex,dark){const k=hex+'|'+dark;if(skinMats.has(k))return skinMats.get(k);const m=base.clone();m.skinning=true;m.color.setHex(hex);if(dark)m.color.multiplyScalar(.82);m.roughness=.62;m.metalness=0;skinMats.set(k,m);return m;}
function aimBone(bone,child,dir){bone.getWorldPosition(_v1);child.getWorldPosition(_v2);_v2.sub(_v1).normalize();
  _q1.setFromUnitVectors(_v2,dir);bone.getWorldQuaternion(_q2);_q2.premultiply(_q1);bone.parent.getWorldQuaternion(_q3).invert();bone.quaternion.copy(_q3.multiply(_q2));bone.updateMatrixWorld(true);}
function playAnim(f,name,fade=.3){if(f.cur===name)return;const clip=ANIM.clips[name];if(!clip)return;
  let a=f.actions[name];if(!a){a=f.actions[name]=f.mixer.clipAction(clip);a.time=Math.random()*clip.duration;}
  a.enabled=true;a.setEffectiveTimeScale(1);a.setEffectiveWeight(1);a.fadeIn(fade).play();if(f.curA)f.curA.fadeOut(fade);f.cur=name;f.curA=a;}
function measurePelvis(clipName){const m=THREE.SkeletonUtils.clone(ANIM.base),mx=new THREE.AnimationMixer(m);mx.clipAction(ANIM.clips[clipName]).play();mx.update(.01);m.updateMatrixWorld(true);
  return m.getObjectByName('pelvis').getWorldPosition(new THREE.Vector3()).y;}
function upgradeFigure(f){
  if(f.up||f.noUpgrade)return;f.up=true;
  const m=THREE.SkeletonUtils.clone(ANIM.base);const bones={};const skms=[];
  m.traverse(o=>{if(o.isBone)bones[o.name]=o;if(o.isSkinnedMesh)skms.push(o);});
  for(const skm of skms){const mats=(Array.isArray(skm.material)?skm.material:[skm.material]).map(mm=>skinMat(mm,f.skinHex,/Joint/i.test(mm.name)));
    skm.material=mats.length===1?mats[0]:mats;skm.castShadow=f===player;skm.receiveShadow=true;skm.frustumCulled=false;}
  f.g.add(m);f.mixer=new THREE.AnimationMixer(m);f.actions={};f.bones=bones;f.man=m;
  playAnim(f,'Idle_Loop',0);f.curA.time=0;f.mixer.update(0);f.g.updateWorldMatrix(true,true);
  for(const h of f.headItems)bones.Head.attach(h);
  for(const b of f.bodyItems)bones.pelvis.attach(b);
  f.oldBody.forEach(o=>o.visible=false);f.legs.forEach(l=>l.visible=false);
  // qual braço antigo (proxy) corresponde a qual osso
  const lp=f.g.worldToLocal(bones.upperarm_l.getWorldPosition(new THREE.Vector3()));
  f.armBones=lp.x<0?[[bones.upperarm_l,bones.lowerarm_l,bones.hand_l],[bones.upperarm_r,bones.lowerarm_r,bones.hand_r]]
                   :[[bones.upperarm_r,bones.lowerarm_r,bones.hand_r],[bones.upperarm_l,bones.lowerarm_l,bones.hand_l]];
  if(f.seated)m.position.y=.72-ANIM.sitPelvis;
  if(f.kneel)m.position.y=.3;
  f.slow=0;
  f.anim=(dt,speed)=>{
    if(f!==player&&!f.g.visible)return;
    // figuras distantes se atualizam com menos frequência
    if(f!==player){const e=f.g.matrixWorld.elements,d=Math.hypot(e[12]-camera.position.x,e[14]-camera.position.z);
      if(d>32){f.slow+=dt;if(f.slow<.1)return;dt=f.slow;}f.slow=0;}
    f.raise+=(f.raiseT-f.raise)*Math.min(1,dt*6);
    let st;
    if(f.forceAnim)st=f.forceAnim;
    else if(f.seated)st=f.gesture?'Sitting_Talking_Loop':'Sitting_Idle_Loop';
    else if(f.kneel)st='Crouch_Idle_Loop';
    else if(speed>7)st='Sprint_Loop';else if(speed>3.2)st='Jog_Fwd_Loop';else if(speed>.2)st='Walk_Loop';
    else st=f.gesture?'Idle_Talking_Loop':'Idle_Loop';
    playAnim(f,st);
    if(f.curA)f.curA.setEffectiveTimeScale(st==='Walk_Loop'?Math.max(.4,speed/1.3):st==='Jog_Fwd_Loop'?speed/3.4:st==='Sprint_Loop'?speed/5.6:1);
    f.mixer.update(dt);

    if(f.raise>.02)f.arms[1].rotation.x=-2.9*f.raise;else if(f.raiseT===0&&f._raised){f.arms[1].rotation.x=0;}
    f._raised=f.raise>.02;

async function put0ad(name,o){const h=await putModel('0ad/'+name+'.glb',{...o,s:1});
  const b=new THREE.Box3().setFromObject(h),sz=b.getSize(new THREE.Vector3());
  const k=(o.size||1)/Math.max(o.byHeight?sz.y:Math.max(sz.x,sz.z),1e-6);
  if(o.flip){const w=h.children[0];w.rotation.x=Math.PI;w.position.y+=sz.y/h.scale.y;}
  h.scale.multiplyScalar(k);
  if(o.ry)h.children[0].rotation.y=o.ry;
  return h;}

  const a={kind,hx:x,hz:z,x,z,tx:x,tz:z,r,wait:rnd()*4,phase:rnd()*6,rot:rnd()*6.28,h:null,area:o.area,follow:o.follow,peck:0};

  const cx=camera.position.x,cz=camera.position.z;
  for(const a of ANIMALS){if(!a.h)continue;
    const far=Math.hypot(a.x-cx,a.z-cz)>80;a.h.visible=!far;if(far)continue;
    let sp=0;
    if(a.follow){const f=a.follow;const fx=f.x-Math.sin(f.f.g.rotation.y)*1.8,fz=f.z-Math.cos(f.f.g.rotation.y)*1.8;a.tx=fx;a.tz=fz;
      const d=Math.hypot(a.tx-a.x,a.tz-a.z);if(d>.25)sp=Math.min(d*1.6,f.sp*1.15);}
    else{const d=Math.hypot(a.tx-a.x,a.tz-a.z);
      if(a.wait>0){a.wait-=dt;}
      else if(d<.2){a.wait=1+rnd()*(a.kind==='dog'?2:5);
        if(a.area){[a.tx,a.tz]=a.area();}else{const an=rnd()*6.28,rr=rnd()*a.r;a.tx=a.hx+Math.cos(an)*rr;a.tz=a.hz+Math.sin(an)*rr;}}
      else sp=ASP[a.kind];}
    const d=Math.hypot(a.tx-a.x,a.tz-a.z);
    if(sp&&d>.01){a.x+=(a.tx-a.x)/d*sp*dt;a.z+=(a.tz-a.z)/d*sp*dt;const ta=Math.atan2(a.tx-a.x,a.tz-a.z);let da=ta-a.rot;da=Math.atan2(Math.sin(da),Math.cos(da));a.rot+=da*Math.min(1,dt*4);}
    a.phase+=dt*(sp?sp*7:1.2);
    const bob=sp?Math.abs(Math.sin(a.phase))*(a.kind==='chicken'?.03:.05):0;
    a.h.position.set(a.x,H(a.x,a.z)+bob,a.z);a.h.rotation.y=a.rot;
    // a galinha bica o chão; os outros abaixam a cabeça para pastar
    if(!sp){a.peck+=dt;const pk=a.kind==='chicken'?Math.max(0,Math.sin(a.peck*5))*.55:a.kind==='dog'?0:Math.max(0,Math.sin(a.peck*.8))*.12;a.h.rotation.x=pk;}
    else{a.h.rotation.x=0;a.h.rotation.z=Math.sin(a.phase)*.04;}
  }
});

  const rh=wp(B.hand_r);spear.position.set(rh.x,rh.y-1.0,rh.z+.05);B.hand_r.attach(spear);

}

function startTiming(o){ // o: {speed, zone, onHit, onMiss}
  stopTiming();const T={pos:0,dir:1,speed:o.speed||1.1,zone:o.zone||.18,o};TIMING=T;
  const zEl=document.querySelector('#dTxt .tz');if(zEl){zEl.style.left=(50-T.zone*50)+'%';zEl.style.width=(T.zone*100)+'%';}
  let last=performance.now();
  const loop=()=>{if(TIMING!==T)return;const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;T.pos+=T.dir*T.speed*dt;if(T.pos>1){T.pos=1;T.dir=-1;}if(T.pos<0){T.pos=0;T.dir=1;}
    const m=document.querySelector('#dTxt .tm');if(m)m.style.left=(T.pos*100)+'%';requestAnimationFrame(loop);};loop();
}

function kitFrom(gltf,name,ground=false){
  const node=gltf.scene.getObjectByName(name);if(!node)throw new Error('peça '+name+' ausente');
  fixMaterials(node);gltf.scene.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(node.matrixWorld).invert(),parts=[],b=new THREE.Box3();
  node.traverse(o=>{if(!o.isMesh)return;const m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();b.union(o.geometry.boundingBox.clone().applyMatrix4(m));
    (Array.isArray(o.material)?o.material:[o.material]).forEach(mt=>{mt.side=THREE.DoubleSide;});
    parts.push({geo:o.geometry,mat:o.material,m});});
  const c=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());
  // ground=true: o "chão" do modelo é o y=0 original do 0 A.D.; a fundação fica enterrada
  const norm=new THREE.Matrix4().makeTranslation(-c.x,ground?0:-b.min.y,-c.z);parts.forEach(p=>p.m.premultiply(norm));
  if(ground)size.y=b.max.y;
  return {parts,size};
}
function placeKit(kit,mats,shadow=true){const out=[],t=new THREE.Matrix4();
  for(const p of kit.parts){const im=new THREE.InstancedMesh(p.geo,p.mat,mats.length);
    mats.forEach((M,i)=>{t.multiplyMatrices(M,p.m);im.setMatrixAt(i,t);});
    im.castShadow=shadow;im.receiveShadow=true;im.frustumCulled=false;scene.add(im);out.push(im);}
  return out;}
// caixas invisíveis para a câmera não entrar nos prédios novos
const OCC_MAT=new THREE.MeshBasicMaterial({visible:false});
function occProxies(list){if(!list.length)return;const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),OCC_MAT,list.length);
  list.forEach((m,i)=>im.setMatrixAt(i,m));im.frustumCulled=false;scene.add(im);occluders.push(im);}
function occBox(x,y,z,rot,w,h,d){return new THREE.Matrix4().compose(new THREE.Vector3(x,y+h/2,z),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rot),new THREE.Vector3(w,h,d));}
const trs=(x,y,z,ry,sx,sy,sz)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),ry),new THREE.Vector3(sx,sy,sz));

const DIPY=(()=>{const[x,z]=cwPt(DIPT);let tx=-Math.sin(DIPT)*CW.rx,tz=Math.cos(DIPT)*CW.rz;const tl=Math.hypot(tx,tz);tx/=tl;tz/=tl;
  let nx=Math.cos(DIPT)/CW.rx,nz=Math.sin(DIPT)/CW.rz;const nl=Math.hypot(nx,nz);nx/=nl;nz/=nl;
  return {x,z,tx,tz,nx,nz,rot:Math.atan2(-tz,tx),depth:15,w:14};})();
// colisões do portão de fora e dos muros do pátio (o portão de dentro já tem as dele)
{ const ox=DIPY.x+DIPY.nx*DIPY.depth,oz=DIPY.z+DIPY.nz*DIPY.depth;

}
async function buildWalls(){
  if((window.__atenasQuality||'equilibrado')==='leve')return;   // no modo leve, ficam as muralhas simples
  const g=await glb('0ad/muralha.glb');
  const gate=kitFrom(g,'gate'),tw=kitFrom(g,'wtower'),wl=kitFrom(g,'wlong');
  // trechos de muralha da cidade e das Muralhas Longas
  const segs=WALLSEGS.filter(r=>r.tag==='city'||r.tag==='long'),mats=[];
  for(const r of segs){const full=r.y1-r.base,mh=Math.min(full,9.5);
    mats.push(trs(r.mx,r.y1-mh,r.mz,r.rot,(r.len+.15)/wl.size.x,mh/wl.size.y,r.th/wl.size.z));
    r.crenels.forEach(c=>c.visible=false);
    if(full<=mh+.05)r.box.visible=false;else{const keep=full-mh+.4;r.box.scale.y=keep/full;r.box.position.y=r.base+keep/2;}}
  // o pátio do Dípilo: dois muros ligando os portões
  for(const s of[-1,1]){const ax=DIPY.x+DIPY.tx*s*6.4,az=DIPY.z+DIPY.tz*s*6.4,mx=ax+DIPY.nx*DIPY.depth/2,mz=az+DIPY.nz*DIPY.depth/2;
    const y=Math.min(H(ax,az),H(mx,mz),H(ax+DIPY.nx*DIPY.depth,az+DIPY.nz*DIPY.depth))-.5;
    mats.push(trs(mx,y,mz,DIPY.rot+Math.PI/2,(DIPY.depth+1)/wl.size.x,8.5/wl.size.y,2.2/wl.size.z));}
  const wallShadow=window.__atenasQuality==='alto';
  placeKit(wl,mats,wallShadow);
  // torres
  const tws=WALLTOWERS.filter(t=>t.tag==='city'||t.tag==='long');
  placeKit(tw,tws.map(t=>{t.meshes.forEach(m=>m.visible=false);const k=(t.s+.5)/Math.max(tw.size.x,tw.size.z);return trs(t.x,t.y-1.2,t.z,0,k,k*(t.h>9?1:.85),k);}),wallShadow);
  // os dois portões e quatro torres ao lado deles
  const kg=DIPY.w/gate.size.x,gm=[],tm=[],kt=5/Math.max(tw.size.x,tw.size.z);
  for(const d of[0,DIPY.depth]){const x=DIPY.x+DIPY.nx*d,z=DIPY.z+DIPY.nz*d;gm.push(trs(x,H(x,z)-.6,z,DIPY.rot,kg,kg,kg));
    if(d>0)for(const s of[-1,1]){const px=x+DIPY.tx*s*(DIPY.w/2+2.2),pz=z+DIPY.tz*s*(DIPY.w/2+2.2);tm.push(trs(px,H(px,pz)-1,pz,DIPY.rot,kt,kt,kt));colliders.push({x:px,z:pz,r:2.6});}}
  placeKit(gate,gm);placeKit(tw,tm);
  if(window.__dipylonOld)window.__dipylonOld.visible=false;
}

async function buildHouses(){
  const q=window.__atenasQuality||'equilibrado';if(q==='leve'||!window.__LOTS)return;
  const g=await glb('0ad/casas.glb'),kits=['houseA','houseB','houseC','houseD'].map(n=>kitFrom(g,n,true));
  // perto de Nikos: casas detalhadas do 0 A.D.; longe: as casas simples continuam no lugar
  const every=q==='alto'?2:3,NEAR=q==='alto'?120:85,CELL=40,cells=new Map(),occ=[],zero=new THREE.Matrix4().makeScale(0,0,0),LM=window.__lotMeshes,t=new THREE.Matrix4();
  window.__LOTS.forEach((L,i)=>{if(i%every!==0)return;const asp=L.a/L.b;if(asp<.7||asp>1.45)return;
    const v=(i/every|0)%4,k=kits[v],sc=Math.max(L.a,L.b)*1.02/Math.max(k.size.x,k.size.z),y=H(L.x,L.z);
    const key=Math.floor(L.x/CELL)+','+Math.floor(L.z/CELL);if(!cells.has(key))cells.set(key,{per:[[],[],[],[]],lots:[],x:0,z:0});
    const c=cells.get(key);c.per[v].push(trs(L.x,y+.05,L.z,L.rot+(i%2)*Math.PI,sc,sc*(.9+((i*7)%5)*.05),sc));c.lots.push(L);c.x+=L.x;c.z+=L.z;
    occ.push(occBox(L.x,y,L.z,L.rot,k.size.x*sc*.85,k.size.y*sc*.9,k.size.z*sc*.85));});
  const CH=[];
  for(const c of cells.values()){c.x/=c.lots.length;c.z/=c.lots.length;const near=[];
    c.per.forEach((list,v)=>{if(!list.length)return;for(const part of kits[v].parts){const im=new THREE.InstancedMesh(part.geo,part.mat,list.length);
      list.forEach((M,i)=>{t.multiplyMatrices(M,part.m);im.setMatrixAt(i,t);});im.castShadow=q==='alto';im.receiveShadow=true;
      im.frustumCulled=false;
      im.visible=false;scene.add(im);near.push(im);}});
    CH.push({x:c.x,z:c.z,near,lots:c.lots,on:false});}
  // as instâncias simples dos lotes trocados ligam e desligam junto com o detalhe
  const setLot=(L,show)=>{const[mv,wi,ri,di]=L.inst;if(show){LM.WMS[mv].setMatrixAt(wi,L._m||zero);LM.rm.setMatrixAt(ri,L._r||zero);LM.dm.setMatrixAt(di,L._d||zero);}
    else{LM.WMS[mv].setMatrixAt(wi,zero);LM.rm.setMatrixAt(ri,zero);LM.dm.setMatrixAt(di,zero);}};
  for(const c of CH)for(const L of c.lots){const[mv,wi,ri,di]=L.inst;L._m=new THREE.Matrix4();L._r=new THREE.Matrix4();L._d=new THREE.Matrix4();
    LM.WMS[mv].getMatrixAt(wi,L._m);LM.rm.getMatrixAt(ri,L._r);LM.dm.getMatrixAt(di,L._d);}
  occProxies(occ);
  // as caixas invisíveis só valem onde a casa detalhada está visível: elas não atrapalham porque ficam do tamanho da casa simples
  let acc=1;EXTRA_TICKS.push(dt=>{acc+=dt;if(acc<.4)return;acc=0;const cx=camera.position.x,cz=camera.position.z;let dirty=false;
    for(const c of CH){const on=Math.hypot(c.x-cx,c.z-cz)<NEAR;if(on===c.on)continue;c.on=on;dirty=true;c.near.forEach(m=>m.visible=on);c.lots.forEach(L=>setLot(L,!on));}
    if(dirty){LM.WMS.forEach(m=>m&&(m.instanceMatrix.needsUpdate=true));LM.rm.instanceMatrix.needsUpdate=true;LM.dm.instanceMatrix.needsUpdate=true;}});
  window.__nHouses=CH.reduce((s,c)=>s+c.lots.length,0);
}

const SACKS=[];function sackAt(x,y,z,r=0,s=1){SACKS.push([x,y,z,r,s]);}
function buildSacks(){if(!SACKS.length)return;
  const geo=new THREE.SphereGeometry(.32,10,8);geo.scale(1,.72,.8);geo.translate(0,.2,0);
  const im=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({color:0xc9b48a,roughness:1}),SACKS.length);
  const tie=new THREE.InstancedMesh(new THREE.CylinderGeometry(.06,.1,.14,8).translate(0,.47,0),new THREE.MeshStandardMaterial({color:0xa8925f,roughness:1}),SACKS.length);
  SACKS.forEach(([x,y,z,r,s],i)=>{const M=trs(x,y,z,r,s,s,s);im.setMatrixAt(i,M);tie.setMatrixAt(i,M);});
  im.castShadow=true;im.receiveShadow=true;im.frustumCulled=tie.frustumCulled=false;scene.add(im,tie);}
// pilhas de sacos: em fileiras, com outra camada por cima
function sackPile(x,z,rot,n=6){const c=Math.cos(rot),s=Math.sin(rot),y=H(x,z);
  for(let i=0;i<n;i++){const lx=(i%3-1)*.66,lz=Math.floor(i/3)*.55;sackAt(x+lx*c+lz*s,y,z-lx*s+lz*c,rot+i*.3);}
  for(let i=0;i<Math.floor(n/3);i++){const lx=(i-.5)*.66;sackAt(x+lx*c+.27*s,y+.38,z-lx*s+.27*c,rot+i);}}

function freeAt(x,z,r,opt={}){
  if(((x-CW.cx)/(CW.rx-7))**2+((z-CW.cz)/(CW.rz-7))**2>1&&!opt.outside)return false;
  if(opt.outside&&((x-CW.cx)/(CW.rx+10))**2+((z-CW.cz)/(CW.rz+10))**2<1)return false;

  const h=H(x,z);if(Math.abs(H(x+r,z)-h)+Math.abs(H(x-r,z)-h)+Math.abs(H(x,z+r)-h)+Math.abs(H(x,z-r)-h)>2.6)return false;
  for(const p of PLACES)if(Math.hypot(x-p.x,z-p.z)<r+3.2)return false;

    const dx=x-c.x,dz=z-c.z,co=Math.cos(c.rot||0),si=Math.sin(c.rot||0),lx=dx*co-dz*si,lz=dx*si+dz*co;

const FIELDS=[];
function fieldFree(x,z,w,d,rot){const c=Math.cos(rot),s=Math.sin(rot);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const lx=i*w/2*.9,lz=j*d/2*.9,px=x+lx*c+lz*s,pz=z-lx*s+lz*c;
    if(Math.abs(px)>325||pz>140||pz<-330)return false;
    if(px<-172&&pz>-128)return false;                                   // serra e Olímpia
    if(!freeAt(px,pz,3.2,{outside:true}))return false;
    if(FIELDS.some(f=>Math.hypot(f.x-px,f.z-pz)<Math.max(f.w,f.d)/2+4))return false;}
  return true;}
function placeFields(kind,n,w,d){let k=0;for(let t=0;t<900&&k<n;t++){const a=rnd()*Math.PI*2,r=1.12+rnd()*.55;
    const x=CW.cx+Math.cos(a)*CW.rx*r,z=CW.cz+Math.sin(a)*CW.rz*r,rot=rnd()*Math.PI;
    if(!fieldFree(x,z,w,d,rot))continue;const f={kind,x,z,w,d,rot};FIELDS.push(f);addCollider(x,z,w/2,d/2,rot);k++;}}
const nF=window.__atenasQuality==='leve'?.6:1;
placeFields('olival',Math.round(6*nF),34,26);
placeFields('trigo',Math.round(6*nF),30,22);
placeFields('vinha',Math.round(5*nF),26,18);

function soil(f,col){const g=new THREE.PlaneGeometry(f.w,f.d,8,6);g.rotateX(-Math.PI/2);g.rotateY(f.rot);const p=g.attributes.position;

function knucklebones(){
  P.locked=true;$('card').hidden=true;nearPlace=null;$('joy').hidden=true;markDiscovery('taverna');
  const FACES=[1,3,4,6],roll=()=>[0,0,0,0].map(()=>FACES[Math.floor(Math.random()*4)]);
  const name=r=>{const u=new Set(r);if(u.size===4)return 'o lance de Afrodite!';if(r.every(v=>v===1))return 'o "cão"! (o pior lance)';return null;};
  const score=r=>{if(new Set(r).size===4)return 100;if(r.every(v=>v===1))return 0;return r.reduce((a,b)=>a+b,0);};
  let me=0,him=0,round=0;const show=r=>r.map(v=>'<b style="display:inline-block;min-width:34px;text-align:center;border:2px solid var(--clay);border-radius:6px;margin:2px;font-size:24px">'+v+'</b>').join('');
  const finish=()=>{hideDlg();P.locked=false;$('joy').hidden=false;};
  const turn=()=>{round++;const a=roll(),b=roll(),sa=score(a),sb=score(b);if(sa>sb)me++;else if(sb>sa)him++;
    dlg('Astrágalos · rodada '+round+' de 3','Os ossinhos rolam na mesa','<section><span class="mgp">Nikos: '+show(a)+(name(a)?' <b>'+name(a)+'</b>':'')+'</span><span class="mgp">O remador: '+show(b)+(name(b)?' <b>'+name(b)+'</b>':'')+'</span><span class="mgp">Placar: Nikos <b>'+me+'</b> × <b>'+him+'</b> remador</span></section>',

  const end=()=>dlg('Na taverna','Fim do jogo',(me>him?'<p>Nikos ganhou! O remador paga a próxima rodada de vinho... bem misturado com água.</p>':me<him?'<p>O remador ganhou e ri alto. "Na assembleia você pode até ter sorte, rapaz, mas nos ossinhos, não!"</p>':'<p>Empate! Os dois brindam e voltam a discutir sobre a Sicília.</p>')+
    '<p>Cada <b>astrágalo</b> tem quatro lados que valem <b>1, 3, 4 e 6</b>. O melhor lance era o de <b>Afrodite</b>, com os quatro lados diferentes. O pior era o <b>cão</b>, com quatro uns.</p><p class="hoje">Muitas crianças brasileiras jogam <b>cinco-marias</b> (ou <b>saquinhos</b>), um jogo que vem desses ossinhos antigos.</p>',[{t:'Sair da taverna ▸',main:true,f:finish}]);
  dlg('Na taverna','Um desafio','<p>Um remador da frota chama Nikos para a mesa: "Uma partida de <b>astrágalos</b>? Três rodadas, quem somar mais ganha!"</p>',[{t:'Jogar 🎲',main:true,f:turn},{t:'Agora não',ghost:true,f:finish}]);
}

// câmera de conversa: fica entre Nikos e quem fala, olhando para o rosto
/* ===== câmera das conversas que mostra quem fala (pedido do professor, 21/11/2026) =====
   Antes a câmera ia sempre para o mesmo lado e às vezes ficava numa parede, numa coluna ou atrás de alguém.
   Agora ela procura, em volta de quem fala, um lugar de onde o rosto aparece sem nada na frente. */
const TALK_RAY=new THREE.Raycaster(),TALK_SPH=new THREE.Sphere();
function talkObstacles(T,R){const list=[];
  scene.traverseVisible(o=>{if(!o.isMesh||o.isSprite||o===beacon)return;
    let p=o;while(p){if(p===player.g||p===arrow)return;p=p.parent;}
    const m=o.material;if(m&&!Array.isArray(m)&&(m.side===THREE.BackSide||(m.transparent&&m.opacity<.5)))return;
    const g=o.geometry;if(!g||!g.attributes||!g.attributes.position)return;
    const tris=(g.index?g.index.count:g.attributes.position.count)/3;if(tris>20000)return;   // blocos grandes: as paredes deles já estão nas colisões
    if(!g.boundingSphere)g.computeBoundingSphere();
    TALK_SPH.copy(g.boundingSphere).applyMatrix4(o.matrixWorld);
    if(!o.isInstancedMesh){if(TALK_SPH.radius>300)return;if(TALK_SPH.center.distanceTo(T)-TALK_SPH.radius>R)return;}
    list.push(o);});
  return list;}
// um ponto do chão está dentro de uma parede, casa, coluna ou muro do jogo?
function talkInside(x,z,cols){for(const c of cols){
    if(c.seg){const[ax,az,bx,bz]=c.seg,vx=bx-ax,vz=bz-az;let t=((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz);t=Math.max(0,Math.min(1,t));if(Math.hypot(x-ax-vx*t,z-az-vz*t)<c.r+.15)return true;continue;}
    if(c.r){if(Math.hypot(x-c.x,z-c.z)<c.r+.1)return true;continue;}
    const dx=x-c.x,dz=z-c.z,a=c.rot||0,cs=Math.cos(a),sn=Math.sin(a);if(Math.abs(dx*cs-dz*sn)<c.hw+.1&&Math.abs(dx*sn+dz*cs)<c.hd+.1)return true;}
  return false;}
function talkClear(T,C,obs,lift,cols,figs){const dir=C.clone().sub(T),len=dir.length();dir.normalize();
  for(let k=1;k<=12;k++){const q=T.clone().addScaledVector(dir,len*k/12);
    if(q.y<H(q.x,q.z)+lift+.25)return false;                                   // morro no caminho
    if(Math.hypot(q.x-T.x,q.z-T.z)>.6&&talkInside(q.x,q.z,cols))return false;  // parede, casa ou coluna no caminho
    for(const f of figs)if(Math.hypot(q.x-f[0],q.z-f[1])<.4&&q.y<f[2]+1.95)return false;}  // outra pessoa na frente
  TALK_RAY.set(T,dir);TALK_RAY.near=.45;TALK_RAY.far=len;TALK_RAY.camera=camera;
  try{return TALK_RAY.intersectObjects(obs,false).length===0;}catch(e){return true;}}
function talkCam(f,lift=0){
  // se o ponto da conversa está ao lado de uma pessoa, a câmera mira essa pessoa
  // e, se a pessoa está de frente para algum lado, a câmera fica na frente dela, para mostrar o rosto
  let face=null;{let bd=lift?1.2:2.5;for(const g of FIGS){if(g===player||(g.hide&&!g.g.visible))continue;const e=g.g.matrixWorld.elements,d=Math.hypot(e[12]-f[0],e[14]-f[1]);if(d<bd){bd=d;f=[e[12],e[14]];face=g.g.rotation.y;}}}
  const fy=H(f[0],f[1])+lift,T=new THREE.Vector3(f[0],fy+1.5,f[1]);
  let a0=Math.atan2(P.x-f[0],P.z-f[1]);if(Math.hypot(P.x-f[0],P.z-f[1])<.3)a0=P.a+Math.PI;
  if(face!==null)a0=face;
  let C=null;
  try{scene.updateMatrixWorld();const obs=talkObstacles(T,6);
    const near=(x,z,r)=>Math.hypot(x-f[0],z-f[1])<r;
    const cols=colliders.filter(c=>c.seg?true:near(c.x,c.z,(c.r||Math.max(c.hw||0,c.hd||0))+6));
    const figs=[];for(const g of FIGS){if(g===player||!g.g.visible)continue;const e=g.g.matrixWorld.elements;if(near(e[12],e[14],6)&&!near(e[12],e[14],.6))figs.push([e[12],e[14],e[13]]);}
    outer:for(const dist of[3.4,2.6,1.9])for(const da of[.3,-.3,.75,-.75,1.2,-1.2,1.7,-1.7,2.3,-2.3,2.9,-2.9]){
      const a=a0+da,cx=f[0]+Math.sin(a)*dist,cz=f[1]+Math.cos(a)*dist,c=new THREE.Vector3(cx,Math.max(fy,H(cx,cz)+lift)+1.9,cz);
      if(talkClear(T,c,obs,lift,cols,figs)){C=c;break outer;}}
  }catch(e){console.warn('câmera da conversa',e);}
  if(!C){const dx=Math.sin(a0),dz=Math.cos(a0),cx=f[0]+dx*3.4-dz*1.1,cz=f[1]+dz*3.4+dx*1.1;C=new THREE.Vector3(cx,Math.max(fy,H(cx,cz)+lift)+2.0,cz);}
  ROWCAM.want.copy(C);ROWCAM.look.set(f[0],fy+.95,f[1]);S.inRow=true;player.g.visible=false;}   // olhar um pouco abaixo do rosto: o rosto fica acima do quadro de texto

// pôr etapas em ordem: errar não apaga o que já está certo
function orderTask(role,who,intro,steps,after){const done=[];
  const draw=msg=>{const left=shuffle(steps.filter(s=>!done.includes(s)));
    dlg(role,who,'<section><span class="mgp">'+intro+'</span><span class="mis-list">'+steps.map((s,k)=>'<span>'+(k+1)+'. '+(done[k]?'<b class="mis-done">'+done[k]+' ✓</b>':'...')+'</span>').join('')+'</span><span class="src mgp" id="ordInfo">'+(msg||'Toque na etapa que vem agora.')+'</span></section>',
      left.map(s=>({t:s,f:()=>{if(s===steps[done.length]){done.push(s);if(done.length===steps.length){toast('Tudo na ordem certa!');after();}else draw('Certo! E depois?');}else{$('ordInfo').innerHTML='<b>Ainda não.</b> Pense no que precisa acontecer <b>antes</b> disso.';}}})));};
  draw();}

const MSAVE={
  has(){try{return !!localStorage.getItem(MIS.KEY);}catch(e){return false;}},

SAVE.save=(orig=>function(){if(MIS.on)return;return orig.call(this);})(SAVE.save);
MIS.step=()=>STEPS[MIS.s]||null;
MIS.enter=()=>{const st=MIS.step();PICK.forEach(p=>{p.g.visible=!!(st&&st.collect);p.got=false;});MSAVE.save();renderDock();};
MIS.adv=()=>{MIS.s++;MIS.enter();};
MIS.reward=id=>{if(!MIS.got.includes(id))MIS.got.push(id);const g=GODS.find(x=>x.id===id);MSAVE.save();
  dlg('Página do livro','Descoberta '+MIS.got.length+' de 15','<section><span class="mis-reward mis-sym">'+g.sym+'</span><span class="mgp">Você encontrou <b>'+g.n+'</b> e recebeu: <b>'+g.rw+'</b>.</span><span class="mgp">'+g.d+'</span></section>',
    [{t:'Continuar ▸',main:true,f:()=>{freeUI();MIS.adv();}},{t:'📖 Ver a página',ghost:true,f:()=>{freeUI();MIS.adv();openBook(id);}}]);};
function misTarget(){const st=MIS.step();if(!st)return null;
  if(st.collect){let best=null,bd=1e9;for(const p of PICK)if(!p.got){const d=Math.hypot(P.x-p.x,P.z-p.z);if(d<bd){bd=d;best=[p.x,p.z];}}return best||KITCHEN_W;}
  return st.at?st.at():null;}
target=(orig=>function(){if(MIS.on&&!chosenDestination)return misTarget();return orig();})(target);
function renderDock(){const el=$('guideDock');if(!MIS.on)return;const st=MIS.step();
  if(!st){el.hidden=true;return;}
  const left=st.collect?PICK.filter(p=>!p.got).length:0;

  $('guideFill').style.width=Math.round(MIS.got.length/3*100)+'%';
  $('guideTitle').textContent=st.title;
  $('guideDesc').textContent=st.collect?st.desc+' Faltam '+left+'.':st.desc;

{ const row=document.createElement('div');row.className='mis-row';row.hidden=true;row.id='misRow';

    if(d<6){chosenDestination=null;beacon.visible=arrow.visible=false;toast('Você chegou!');return;}
    beacon.visible=!S.inParth;beacon.position.set(t[0],H(t[0],t[1])+13,t[1]);beacon.material.opacity=.16+Math.sin(t0*3)*.06;
    arrow.visible=d>7&&!S.inParth;arrow.position.set(P.x,H(P.x,P.z)+2.75+Math.sin(t0*4)*.06,P.z);arrow.rotation.y=Math.atan2(t[0]-P.x,t[1]-P.z);return;}
  const busy=!$('dlg').hidden||P.locked||!$('start').hidden;
  $('guideDock').hidden=busy||!MIS.step()||!book.hidden;
  const st=MIS.step(),t=st&&!busy?misTarget():null;
  for(const p of PICK)if(p.g.visible){p.g.position.y=.3+Math.sin(t0*3)*.06;p.g.rotation.y+=.02;}
  if(!t){beacon.visible=arrow.visible=false;return;}
  const d=Math.hypot(P.x-t[0],P.z-t[1]),py=H(P.x,P.z);
  beacon.visible=!S.inParth;beacon.position.set(t[0],H(t[0],t[1])+13,t[1]);beacon.material.opacity=.16+Math.sin(t0*3)*.06;
  arrow.visible=d>7&&!S.inParth;arrow.position.set(P.x,py+2.75+Math.sin(t0*4)*.06,P.z);arrow.rotation.y=Math.atan2(t[0]-P.x,t[1]-P.z);
  if(st.collect){for(const p of PICK)if(p.g.visible&&!p.got&&Math.hypot(P.x-p.x,P.z-p.z)<1.4){p.got=true;p.g.visible=false;toast('Nikos pegou '+p.name+'.');
      if(PICK.every(q=>q.got)){toast('Tudo pronto! Agora leve para a cozinha.');MIS.adv();}else renderDock();}return;}
  if(d<st.r)st.run();
});
// ---------- começar e continuar ----------
function misStart(load){const d=load?MSAVE.read():null;
  MIS.on=true;MIS.s=0;MIS.got=[];MIS.right=0;MIS.total=0;
  begin(false);MNPC.forEach(f=>{f.hide=false;if(!colliders.includes(f.col))colliders.push(f.col);});btnBook.hidden=false;$('misRow').hidden=false;$('guideContinue').hidden=true;
  if(d){MIS.s=Math.min(d.s|0,STEPS.length);MIS.got=d.got||[];MIS.right=d.right|0;MIS.total=d.total|0;}
  const st=STEPS[MIS.s];
  if(d&&d.P&&isFinite(d.P.x)&&st&&st.m!=='intro'&&!(st.m==='hestia')){P.x=d.P.x;P.z=d.P.z;P.a=d.P.a;}
  else{P.x=HOUSE.x+12.5;P.z=HOUSE.z;P.a=-Math.PI/2;quiet=PLACES.find(q=>q.id==='casa')||null;}
  collide();const y=H(P.x,P.z);camPos.set(P.x-Math.sin(P.a)*7.5,y+3.6,P.z-Math.cos(P.a)*7.5);camLook.set(P.x,y+1.7,P.z);
  MIS.enter();if(d)toast('Missão retomada: '+MIS.got.length+' de 15 deuses no livro.');else toast('Fale com o avô, no pátio de casa.');
}
setInterval(()=>{if(MIS.on&&!P.locked)MSAVE.save();},4000);
// botão na tela inicial
renderIntro=(orig=>function(){orig();const nav=$('intro').querySelector('.mode-choice');const box=document.createElement('div');box.className='mis-entry';
  box.innerHTML='<b>📜 Modo Missão: o Livro dos Deuses</b><span>Encontre os deuses de Atenas, descubra suas histórias e complete o livro. Capítulo 1: Héstia, Atena e Hermes.</span>'+
   (MSAVE.has()?'<button id="misLoad">⟳ Continuar a missão</button><button id="misNew" class="ghost">Recomeçar a missão</button>':'<button id="misNew">Começar o Modo Missão ▸</button>');
  if(nav)nav.after(box);else $('intro').prepend(box);
  if($('misLoad'))$('misLoad').onclick=()=>misStart(true);
  $('misNew').onclick=()=>{MSAVE.wipe();misStart(false);};})(renderIntro);

renderIntro();
function begin(skip){
  $('start').hidden=true;$('toolsBar').hidden=false;$('hud').hidden=false;$('map').hidden=mapOff;$('mapBtn').hidden=false;$('joy').hidden=false;started=true;renderTasks();
  camPos.set(P.x,H(P.x,P.z)+20,P.z+25);camLook.set(P.x,H(P.x,P.z),P.z);
  if(GUIDE_MODE){startGuided();}else if(skip)startAssembly();else canvas.focus();
}

/* ===== grandes momentos da exploração livre e telas de celular (pedido do professor, 21/11/2026) =====
   1) Exploração livre com rumo: seis grandes momentos do dia, sem ordem e sem obrigação, cada um com "Mostrar o caminho".
      Os círculos no chão e os pontos do minimapa aparecem só perto de Nikos (e nos lugares dos grandes momentos).
   2) Celular: a abertura rola; o painel da esquerda começa recolhido; os botões da direita ficam num "☰ Mais";
      o cartão rola com os botões sempre à vista; sem "(E)" nos botões de toque. */
const placeAt=id=>()=>{const p=PLACES.find(q=>q.id===id);return p?[p.x,p.z]:null;};
const MOMENTOS=[
 {ico:'🙋',t:'Votar na assembleia',onde:'na colina da Pnyx',done:()=>!!S.assembly,at:()=>[PNYX.x,PNYX.z-6],place:null},
 {ico:'⚖️',t:'Assistir a um julgamento',onde:'no tribunal, a Heliaia, na ágora',done:()=>!!S.julg,at:placeAt('julgamento'),place:'julgamento'},
 {ico:'🎭',t:'Ver "As Troianas" no teatro',onde:'no teatro, ao pé da Acrópole',done:()=>!!S.peca,at:placeAt('peca'),place:'peca'},
 {ico:'🚣',t:'Remar numa trirreme',onde:'no porto do Pireu',done:()=>!!EXTRA.remo,at:placeAt('trirreme'),place:'trirreme'},
 {ico:'🏃',t:'Correr em Olímpia',onde:'pelo portal azul da ágora',done:()=>!!EXTRA.olimpiadas,at:placeAt('portal_olimpia'),place:'portal_olimpia'},
 {ico:'🍲',t:'Jantar com a família',onde:'na casa de Nikos, no Cerâmico',done:()=>!!EXTRA.jantar,at:placeAt('jantar'),place:'jantar'},
];
const MOM_PLACES=new Set(MOMENTOS.map(m=>m.place).filter(Boolean));
function placeShown(p){return Math.hypot(P.x-p.x,P.z-p.z)<40||(!MIS.on&&MOM_PLACES.has(p.id));}
const isSmall=()=>matchMedia('(max-width:700px), (max-height:520px)').matches;
const isTouch=()=>matchMedia('(pointer:coarse)').matches;
{ const st=document.createElement('style');st.textContent=`
#start{overflow-y:auto;place-items:start center}
#start>.box{margin:auto}
#momBtn{display:block;width:100%;margin:6px 0 2px;min-height:44px;font-size:17px;border:2px solid var(--olive);background:rgba(159,174,92,.16);color:var(--bone)}
#hud.min #momBtn{width:auto;display:inline-block;margin:6px 0 0;padding:6px 10px}
.mom-list{display:grid;gap:8px;margin:10px 0}
.mom{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:2px solid #5a3f2e;border-radius:8px;background:rgba(0,0,0,.25)}
.mom.ok{border-color:var(--olive)}
.mom .i{font-size:30px;text-align:center;font-family:"Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mom b{display:block;font-size:19px}.mom small{display:block;font-size:15px;opacity:.85}
.mom button{min-height:44px;font-size:15px;padding:6px 10px}
#toolsToggle{display:none}
#cardBtns{position:sticky;bottom:0;background:inherit;padding-bottom:4px}
#guideDock .mis-row button{width:auto!important;min-width:0}
#guideDock .mis-row button:first-child{flex:1}
@media (max-width:700px),(max-height:520px){
  #toolsBar #toolsToggle{display:block;min-height:44px;font-size:16px;font-weight:700}
  #toolsBar.fold>button:not(#toolsToggle):not(#btnLost):not(#btnBook){display:none}
  #toolsBar button{min-height:42px}
  #hud.min .lbl{font-size:13px;letter-spacing:.06em}
  #hud.min{max-width:calc(100vw - 150px - env(safe-area-inset-right,0px));box-sizing:border-box}
  #hud.min #momBtn{font-size:15px;padding:5px 8px}
  #card:not([hidden]){display:flex;flex-direction:column}
  #card #cardText{overflow-y:auto;min-height:0}
}
@media (max-width:540px){.mom{grid-template-columns:34px 1fr}.mom button{grid-column:1 / -1}}
@media (max-height:520px){
  #map{width:110px!important;height:110px!important}
  #toolsBar{top:calc(130px + env(safe-area-inset-top,0px))!important}
  #card:not([hidden]){width:min(520px,calc(100vw - 195px - env(safe-area-inset-right,0px)))!important;max-height:calc(100dvh - 140px)!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;right:calc(125px + env(safe-area-inset-right,0px))!important}
}`;document.head.appendChild(st);}
// botão dos grandes momentos, logo abaixo do título do painel
const momBtn=document.createElement('button');momBtn.id='momBtn';momBtn.className='ghost';
document.querySelector('#hud .lbl').after(momBtn);
function momCount(){return MOMENTOS.filter(m=>m.done()).length;}
function renderMomBtn(){const t='⭐ Grandes momentos: '+momCount()+' de '+MOMENTOS.length;if(momBtn.textContent!==t)momBtn.textContent=t;momBtn.hidden=MIS.on;}
function showMomentos(){
  showOverlay('Grandes momentos do dia','<p>Seis coisas que valem a visita. <b>Não há ordem nem obrigação</b>: escolha uma, siga a luz dourada e continue explorando no caminho.</p><div class="mom-list">'+
    MOMENTOS.map((m,i)=>'<div class="mom'+(m.done()?' ok':'')+'"><span class="i">'+m.ico+'</span><span><b>'+(m.done()?'✓ ':'')+m.t+'</b><small>'+m.onde+'</small></span><button class="ghost" data-mom="'+i+'">Mostrar o caminho</button></div>').join('')+'</div>');
  document.querySelectorAll('[data-mom]').forEach(b=>b.onclick=()=>{const m=MOMENTOS[+b.dataset.mom],at=m.at();if(!at)return;
    chosenDestination={t:m.t,at};closeOverlay();toast('Siga a luz dourada: '+m.t+'.');});}
momBtn.onclick=showMomentos;
// botão "☰ Mais" que guarda os botões da direita no celular
const toolsToggle=document.createElement('button');toolsToggle.id='toolsToggle';toolsToggle.textContent='☰ Mais';toolsToggle.setAttribute('aria-expanded','false');
$('toolsBar').prepend(toolsToggle);
toolsToggle.onclick=()=>{const tb=$('toolsBar'),open=tb.classList.toggle('fold')===false;toolsToggle.textContent=open?'✕ Fechar':'☰ Mais';toolsToggle.setAttribute('aria-expanded',String(open));};
$('toolsBar').addEventListener('click',e=>{if(e.target!==toolsToggle&&e.target.tagName==='BUTTON'&&isSmall()&&!$('toolsBar').classList.contains('fold')){$('toolsBar').classList.add('fold');toolsToggle.textContent='☰ Mais';toolsToggle.setAttribute('aria-expanded','false');}});
// no toque, os botões não mostram a tecla (E) do computador
refreshCard=(orig=>function(){orig();if(isTouch())$('cardBtns').querySelectorAll('button').forEach(b=>{if(b.textContent.includes(' (E)'))b.textContent=b.textContent.replace(' (E)','');});})(refreshCard);
// ao começar: título certo no Modo Missão, painéis recolhidos em tela pequena e uma dica dos grandes momentos
begin=(orig=>function(skip){orig(skip);
  document.querySelector('#hud .lbl').textContent=MIS.on?'Modo Missão · Livro dos Deuses':'Atenas · visite como quiser';
  renderMomBtn();
  if(isSmall()){setMin('hud',true);$('toolsBar').classList.add('fold');}
  if(!MIS.on&&!skip)setTimeout(()=>{if(!P.locked&&$('dlg').hidden)toast('Dica: toque em ⭐ Grandes momentos para escolher o que ver.');},2500);
})(begin);
// a cada instante: contador dos momentos e círculos só perto de Nikos
{ let acc=0;EXTRA_TICKS.push(dt=>{acc+=dt;if(acc<.3)return;acc=0;renderMomBtn();for(const p of PLACES)if(p.ring)p.ring.visible=placeShown(p);}); }
})();
</script>

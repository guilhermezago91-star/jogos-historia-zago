<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Príncipe Chegou! — Rio 1808–1822 · v40</title><style>html,body{margin:0;background:#10252e;color:#f5e9ce;font:20px system-ui;height:100%}main{min-height:100%;display:grid;place-content:center;text-align:center;padding:16px;box-sizing:border-box}p{max-width:600px}</style></head><body><main><h1>O Príncipe Chegou!</h1><p id="status">Carregando a versão 40 do Rio de Janeiro…</p></main><script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const names=Array.from({length:14},(_,i)=>'rio-v40-partes/parte-'+String(i+1).padStart(2,'0')+'.txt');
  const chunks=await Promise.all(names.map(async n=>{const r=await fetch(n);if(!r.ok)throw new Error(n+': HTTP '+r.status);return r.text()}));
  const page=chunks.join('');
  if(!page.startsWith('<!doctype html>')||!page.trimEnd().endsWith('</html>'))throw new Error('O arquivo recebido está incompleto.');
  document.open();document.write(page);document.close();
 }catch(e){status.textContent='Não foi possível carregar o jogo: '+e.message+'. Atualize a página para tentar novamente.';console.error(e);}
})();
</script></body></html>
